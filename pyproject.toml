[project]
name = "pocketrelay"
version = "0.1.0"
description = "A free-to-use mobile remote for Google Antigravity Through Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.4",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "tenacity>=9.0",
]

[project.scripts]
pocketrelay = "pocketrelay.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.6.1",
    "mypy>=1.11.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
